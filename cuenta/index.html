r:var(--brass-text)}.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}.plan{position:relative}.plan h3{margin:0}.plan .price{font:700 30px var(--display);margin:6px 0 12px}.plan .price small{font:500 14px var(--body);color:var(--muted)}.plan ul{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:7px}.plan li{padding-left:24px;position:relative}.plan li:before{content:"";position:absolute;left:2px;top:.45em;width:12px;height:7px;border-left:2px solid var(--good);border-bottom:2px solid var(--good);transform:rotate(-45deg)}.plan.hot{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass) inset,var(--shadow)}.plan .rib{position:absolute;top:-11px;right:16px;background:var(--brass);color:var(--brass-ink);font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}</style>
