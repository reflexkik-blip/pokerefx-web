<section><div class="wrap" style="max-width:760px">
<h1>Contact</h1>
<p>An idea, a bug or a chart that doesn't add up? Write to us and we will reply within a few days.</p>
<form id="contact" class="box" novalidate style="display:grid;gap:14px;margin-top:20px">
<p hidden><label>No rellenar <input name="web"></label></p>
<label class="f">Nombre<input type="text" name="nombre" required maxlength="80" autocomplete="name"></label>
<label class="f">Email<input type="email" name="email" required maxlength="120" autocomplete="email"></label>
<label class="f">Asunto<select name="asunto"><option>Pregunta</option><option>Bug on the site</option><option>A range doesn't add up</option><option>Sugerencia</option><option>Collaboration</option></select></label>
<label class="f">Mensaje<textarea name="mensaje" rows="6" required maxlength="3000" style="font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);color:var(--ink)"></textarea></label>
<div class="row"><button class="btn pri" type="submit">Enviar mensaje</button><span class="small" id="contact-msg" role="status"></span></div>
</form></div></section>
<script>document.getElementById('contact').addEventListener('submit',function(e){e.preventDefault();const f=e.target,m=document.getElementById('contact-msg'),d=new FormData(f);if(d.get('web'))return;if(!f.reportValidity())return;m.textContent='Enviando…';
fetch('https://mbbjgprfkmmysjhpyjas.supabase.co/rest/v1/contact',{method:'POST',headers:{'apikey':'sb_publishable_WybvVuZs_IGCGV1IzgX6uQ_hbfUSTXa','Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({nombre:d.get('nombre'),email:d.get('email'),asunto:d.get('asunto'),mensaje:d.get('mensaje')})})
.then(r=>{if(!r.ok)throw 0;f.reset();m.textContent='Message sent. We\'ll reply within a few days.';}).catch(()=>{m.textContent='It couldn\'t be sent. Your text is still there: try again in a while.';});});</script>
</main>
